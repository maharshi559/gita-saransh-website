<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><title>laddoo</title><style>@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(20deg)}}@keyframes wv{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}@keyframes rk{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes nt{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-18px)}}@keyframes fl{0%,100%{transform:scale(1,1) rotate(0deg)}30%{transform:scale(.94,1.06) rotate(-3deg)}60%{transform:scale(1.04,.95) rotate(2deg)}}.a-bob{animation:b 3.4s ease-in-out infinite}.a-breathe{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.a-blink{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}.a-twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.a-wave{animation:wv 1s ease-in-out infinite}.a-rock{animation:rk 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.a-sway{animation:sw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.a-note{animation:nt 1.8s ease-out infinite}.a-flicker{animation:fl .9s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
